  <script>
    (function() {
      var button = document.getElementById('theme-toggle');
      var body = document.body;
      if (!button || !body) {
        return;
      }

      function setTheme(theme) {
        body.setAttribute('data-theme', theme);
        try {
          localStorage.setItem('theme', theme);
        } catch (err) {}
        var isDark = theme === 'dark';
        button.setAttribute('aria-label', isDark ? 'Switch to light theme' : 'Switch to dark theme');
        button.setAttribute('title', isDark ? 'Switch to light theme' : 'Switch to dark theme');
        button.innerHTML = '<i class="fas ' + (isDark ? 'fa-sun' : 'fa-moon') + '" aria-hidden="true"></i><span class="sr-only">Switch theme</span>';
      }

      var storedTheme = null;
      try {
        storedTheme = localStorage.getItem('theme');
      } catch (err) {}
      setTheme(storedTheme || body.getAttribute('data-theme') || 'light');

      button.addEventListener('click', function() {
        var nextTheme = body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        setTheme(nextTheme);
      });
    })();
  </script>
  <script>
    (function() {
      var skeleton = document.getElementById('page-skeleton');
      function hideSkeleton() {
        if (!skeleton) {
          return;
        }
        skeleton.classList.add('is-hidden');
        setTimeout(function() {
          skeleton.remove();
        }, 360);
      }
      if (document.readyState === 'complete') {
        setTimeout(hideSkeleton, 220);
      } else {
        window.addEventListener('load', function() {
          setTimeout(hideSkeleton, 220);
        });
      }

      document.querySelectorAll('.js-typing').forEach(function(el) {
        var text = el.getAttribute('data-typing') || el.textContent || '';
        var prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (prefersReducedMotion || !text) {
          el.textContent = text;
          return;
        }
        el.textContent = '';
        var index = 0;
        function typeNext() {
          el.textContent = text.slice(0, index + 1);
          index += 1;
          if (index < text.length) {
            setTimeout(typeNext, 75);
          } else {
            el.classList.add('is-finished');
          }
        }
        setTimeout(typeNext, 260);
      });

      document.querySelectorAll('a[href]').forEach(function(link) {
        link.addEventListener('click', function(event) {
          var href = link.getAttribute('href') || '';
          var isModified = event.metaKey || event.ctrlKey || event.shiftKey || event.altKey;
          if (isModified || link.target || href.indexOf('#') === 0 || href.indexOf('mailto:') === 0 || href.indexOf('tel:') === 0 || href.indexOf('http') === 0) {
            return;
          }
          document.body.classList.add('is-leaving');
        });
      });
    })();
  </script>
